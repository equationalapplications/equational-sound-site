name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CUTOVER (2026-11-03, Kurt-approved): custom domain, root base.
      # To revert to staging: SITE_ORIGIN=https://equationalapplications.github.io
      # and SITE_BASE=/equational-sound-site and delete public/CNAME.
      SITE_ORIGIN: https://equationalsound.com
      SITE_BASE: /
      # GA4 (D13; property created 2026-11-03 by Kurt — account 414495970,
      # property 562069071, web stream 16259400466 for https://equationalsound.com)
      PUBLIC_GA4_MEASUREMENT_ID: G-77HXWT09MH
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          path: .
          # Astro 7 requires Node >= 22.12
          node-version: 22

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
